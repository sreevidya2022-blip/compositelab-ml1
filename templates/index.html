<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Metal Foam ML</title>

<style>
body{
font-family:Arial;
background:#f5f5f5;
padding:40px;
}

.upload-grid{
display:flex;
gap:20px;
margin-bottom:20px;
}

.file-drop{
background:white;
border:2px dashed #bbb;
padding:20px;
width:200px;
text-align:center;
cursor:pointer;
}

.file-drop.has-file{
border-color:green;
}

.drop-icon{
font-size:20px;
font-weight:bold;
display:block;
margin-bottom:10px;
}

.btn-primary{
padding:12px 20px;
background:#007bff;
color:white;
border:none;
cursor:pointer;
}

.btn-primary:disabled{
background:#aaa;
cursor:not-allowed;
}

.inv-section{
margin-top:40px;
background:white;
padding:20px;
}

.inv-grid{
display:grid;
grid-template-columns:repeat(2,150px);
gap:10px;
margin-bottom:10px;
}

input{
padding:6px;
}
</style>
</head>

<body>

<h2>Upload Datasets</h2>

<div class="upload-grid">

<label class="file-drop" id="drop-theory">
<input type="file" id="file-theory" accept=".xlsx" hidden>
<span class="drop-icon">T</span>
<span>Theory Dataset</span>
<div id="name-theory">Click to upload</div>
</label>

<label class="file-drop" id="drop-fea">
<input type="file" id="file-fea" accept=".xlsx" hidden>
<span class="drop-icon">F</span>
<span>FEA Dataset</span>
<div id="name-fea">Click to upload</div>
</label>

<label class="file-drop" id="drop-exp">
<input type="file" id="file-exp" accept=".xlsx" hidden>
<span class="drop-icon">E</span>
<span>Experimental Dataset</span>
<div id="name-exp">Click to upload</div>
</label>

</div>

<button id="train-btn" class="btn-primary" disabled onclick="trainModels()">
Train Models
</button>

<hr>

<div class="inv-section">

<h3>Inverse Design</h3>

<div class="inv-grid">

<input id="inv-density" placeholder="Density">
<input id="inv-stress" placeholder="Stress">

<input id="inv-energy" placeholder="Energy">
<input id="inv-strain" placeholder="Strain">

</div>

<button class="btn-primary inv-btn" id="inv-run-btn" onclick="runInverse()">
Run Inverse
</button>

<pre id="inv-output"></pre>

</div>

<script src="app.js"></script>

</body>
</html>
